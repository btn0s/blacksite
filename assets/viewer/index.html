<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blacksite open library</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Blacksite open library</h1>
      <p id="summary">Loading the built library…</p>
      <nav>
        <label>Pack <select id="pack"></select></label>
        <label>Sky <select id="sky"></select></label>
        <label>Floor <select id="floor"></select></label>
        <label><input type="checkbox" id="ktx2" /> KTX2 textures</label>
        <a href="./CREDITS.md">Credits</a>
      </nav>
    </header>
    <section class="stage">
      <canvas id="view"></canvas>
      <p class="hint">Drag to orbit, scroll to zoom. Lit by the selected sky through the zone grade.</p>
    </section>
    <main id="sheet"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
