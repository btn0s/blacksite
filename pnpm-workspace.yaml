packages:
  - "packages/*"
  - "examples/*"
  - "vendor/als-web"
  - "vendor/three"
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  puppeteer: false
autoInstallPeers: false
overrides:
  react: '^19.3.1'
  react-dom: '^19.3.1'
  three: 'workspace:*'
  '@types/three': '^0.186.0'
  '@react-three/fiber': '^9.8.2'
minimumReleaseAgeExclude:
  - '@react-three/fiber@9.8.2'
