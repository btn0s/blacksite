<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"/><title>Cascade · worker demo</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#10161a;overflow:hidden;font:12px/1.4 ui-monospace,monospace;color:#cfe}canvas{display:block;touch-action:none}button{font:inherit;min-height:42px;padding:6px 10px;cursor:pointer;background:#182629;color:#dff;border:1px solid #617979;border-radius:4px}button.on{background:#2d6;color:#031}#hud{position:absolute;inset:calc(12px + env(safe-area-inset-top)) auto auto calc(12px + env(safe-area-inset-left));max-width:min(420px,62vw);pointer-events:none}#hud details{background:#000d;border:1px solid #617979;border-radius:5px;pointer-events:auto;max-height:50vh;overflow:auto}#hud summary{list-style:none;padding:8px 10px;cursor:pointer;color:#bfe}#hud summary::-webkit-details-marker{display:none}#hud summary:after{content:' ▾'}#hud details[open] summary:after{content:' ▴'}#stats{white-space:pre-wrap;padding:0 10px 10px;font-size:11px}#row{position:absolute;left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:7px;flex-wrap:wrap}#row button{flex:none}#settings{position:relative;margin-left:auto}#settings summary{list-style:none;background:#182629;color:#dff;border:1px solid #617979;border-radius:4px;min-height:42px;padding:10px;cursor:pointer}#settings summary::-webkit-details-marker{display:none}#settings-panel{position:absolute;right:0;bottom:calc(100% + 7px);width:200px;background:#000e;border:1px solid #617979;border-radius:5px;padding:9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media(max-width:900px), (max-height:500px){#hud{max-width:min(205px,52vw);top:calc(52px + env(safe-area-inset-top))}#row{flex-wrap:nowrap}#row>button{padding:6px 8px}#hud details[open]{max-height:40vh}}
</style></head><body><div id="hud"><details id="hudDetails" open><summary>Cascade · worker / stats</summary><div id="stats">loading…</div></details></div><div id="row"><button id="demolish" disabled>Demolish</button><button id="reset" disabled>Reset</button><details id="settings"><summary>Settings</summary><div id="settings-panel"><button id="connections" aria-pressed="false">Show connections</button><span>Physics</span><button id="hz30" class="on">30 Hz</button><button id="hz60">60 Hz</button></div></details></div><script type="module" src="../src/demos/cascade-worker.ts"></script></body></html>
